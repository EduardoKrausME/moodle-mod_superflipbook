<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f5f2eb">
    <meta name="description"
          content="Leitor flipbook para PDFs, com animação de páginas, navegação e zoom.">
    <title>Fólio — Seu PDF, uma nova leitura</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
<div class="app-shell" id="app">
    <section class="reader-section" aria-label="Leitor de livros PDF">
        <div class="reader-topline">
            <div class="reader-publication">
                <div><strong id="document-title">Documento PDF</strong><span id="document-details">AGUARDANDO PDF</span>
                </div>
            </div>
            <div class="reader-toolbar" role="toolbar" aria-label="Ferramentas do leitor">
                <button type="button" class="tool-button" id="mode-button" data-action="mode"
                        title="Exibir uma página" aria-label="Exibir uma página" aria-pressed="true">
                    <svg class="view-mode-spread" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                         focusable="false">
                        <rect x="3.5" y="4" width="17" height="16" rx="1.5"></rect>
                        <path d="M12 4v16"></path>
                    </svg>
                    <svg class="view-mode-single" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                         focusable="false" hidden>
                        <rect x="6" y="4" width="12" height="16" rx="1.5"></rect>
                    </svg>
                </button>
                <span class="toolbar-divider"></span>
                <button type="button" class="tool-button" data-action="zoom-out" title="Diminuir zoom"
                        aria-label="Diminuir zoom">−
                </button>
                <span id="zoom-label" class="zoom-label" aria-live="polite">100%</span>
                <button type="button" class="tool-button" data-action="zoom-in" title="Aumentar zoom"
                        aria-label="Aumentar zoom">+
                </button>
                <span class="toolbar-divider"></span>
                <button type="button" class="tool-button" id="fullscreen-button" data-action="fullscreen"
                        title="Tela cheia" aria-label="Tela cheia" aria-pressed="false">
                    <svg class="fullscreen-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                         focusable="false">
                        <path d="M8 4H4v4M16 4h4v4M4 16v4h4M20 16v4h-4"></path>
                    </svg>
                    <svg class="fullscreen-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                         focusable="false" hidden>
                        <path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div class="book-stage" id="book-stage">
            <button type="button" class="turn-arrow turn-arrow-prev" data-action="prev"
                    aria-label="Página anterior">‹
            </button>
            <div class="book-viewport" id="book-viewport">
                <div class="book-spread" id="book-spread" aria-live="polite" aria-atomic="true"></div>
            </div>
            <button type="button" class="turn-arrow turn-arrow-next" data-action="next" aria-label="Próxima página">
                ›
            </button>
            <div class="reader-loading" id="reader-loading" hidden><span class="loader"></span><span
                    id="loading-message">Preparando as páginas...</span></div>
        </div>
        <div class="reader-bottomline">
            <div class="paging-actions">
                <button type="button" class="nav-button" data-action="first" aria-label="Primeira página"
                        title="Primeira página">⇤
                </button>
                <span>Página</span><input id="page-number" type="number" min="1" max="1" value="1"
                                          aria-label="Número da página" inputmode="numeric"><span>de <strong
                    id="page-count">0</strong></span>
                <button type="button" class="nav-button" data-action="last" aria-label="Última página"
                        title="Última página">⇥
                </button>
            </div>
            <div class="progress-control"><input type="range" id="page-progress" min="1" max="1" value="1"
                                                 aria-label="Navegar pelas páginas"><span
                    id="progress-label">0%</span></div>
        </div>
        <p class="reader-error" id="reader-error" role="alert" hidden></p>
    </section>
</div>
<input id="pdf-input" type="file" accept=".pdf,application/pdf" hidden aria-label="Selecionar arquivo PDF">
</body>
</html>
